<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePlayer - Minimalist Audio Wave Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="player-card">
        <!-- Visualizer Container -->
        <div class="visualizer-wrapper">
            <canvas id="visualizerCanvas"></canvas>
            <div class="visualizer-badge">
                <span class="badge-dot"></span>
                <span id="visualizerModeLabel">Waveform Mode</span>
            </div>
            <div class="visualizer-controls">
                <button id="modeWaveBtn" class="mode-btn active" title="Waveform Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h3l3-9 4 18 4-12 3 6h3"/></svg>
                </button>
                <button id="modeBarsBtn" class="mode-btn" title="Spectrum Bars">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                </button>
                <button id="modeRadialBtn" class="mode-btn" title="Radial Pulse">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <!-- Track Information -->
        <div class="track-info">
            <div class="track-text">
                <h1 id="trackTitle" class="track-title">Cyberwave Ambient</h1>
                <p id="trackArtist" class="track-artist">Procedural Synth Engine</p>
            </div>
            <label for="audioFileInput" class="upload-btn" title="Upload Audio File">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                <span>Upload</span>
                <input type="file" id="audioFileInput" accept="audio/*">
            </label>
        </div>

        <!-- Progress / Scrubber -->
        <div class="progress-section">
            <input type="range" id="progressBar" class="slider progress-slider" value="0" min="0" max="100" step="0.1">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- Player Controls -->
        <div class="controls-section">
            <div class="secondary-controls">
                <button id="synthGenBtn" class="icon-btn action-badge" title="Generate Synth Beat">
                    ✨ Synth Beat
                </button>
            </div>

            <div class="main-controls">
                <button id="prevBtn" class="control-btn" title="Previous Track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"/></svg>
                </button>
                <button id="playPauseBtn" class="control-btn play-btn" title="Play / Pause">
                    <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <svg id="pauseIcon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button id="nextBtn" class="control-btn" title="Next Track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"/></svg>
                </button>
            </div>

            <div class="volume-container">
                <button id="muteBtn" class="icon-btn" title="Mute / Unmute">
                    <svg id="volHighIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <svg id="volMuteIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
                </button>
                <input type="range" id="volumeBar" class="slider volume-slider" value="80" min="0" max="100">
            </div>
        </div>

        <!-- Playlist Drawer / Selector -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h2>Playlist</h2>
            </div>
            <ul id="playlistTracks" class="playlist-tracks">
                <!-- Track items dynamically rendered or default demo tracks -->
            </ul>
        </div>
    </main>

    <audio id="audioElement" crossorigin="anonymous"></audio>

    <script src="app.js"></script>
</body>
</html>
